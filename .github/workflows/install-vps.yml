# =============================================================================
# Install the full Pulse Tunnel stack on a VPS.
#
# Triggered by the admin panel's "Install" button via repository_dispatch:
#   POST /repos/{owner}/{repo}/dispatches
#   { "event_type": "install-vps",
#     "client_payload": { "vps_ip", "vps_password", "pki_b64" } }
#
# The panel cannot SSH itself (Cloudflare Workers have no outbound TCP), so the
# install is executed here on a GitHub-hosted runner instead. The panel polls
# the run status — no callback, and no credential ever stored panel-side.
#
# ── Why the first step is "Mask credentials" ──────────────────────────────────
# GitHub prints an `env:` group at the start of EVERY step. Any secret sitting
# in `env:` is therefore written to the log verbatim for every step that runs
# BEFORE ::add-mask:: registers it — job-level env made the root password and
# the OpenVPN CA (which contains server.key) appear in plaintext in steps 2-4.
#
# So: this step runs FIRST, has NO `env:` block at all, and reads the values
# out of $GITHUB_EVENT_PATH with jq. Nothing to print, nothing to leak. Later
# steps declare the secrets in their own step-level `env:` — by then they are
# registered, so the same dump renders them as `***`.
# =============================================================================
name: Install Pulse Stack on VPS

on:
  repository_dispatch:
    types: [install-vps]
  workflow_dispatch:
    inputs:
      vps_ip:
        description: "VPS public IP"
        required: true
        type: string
      vps_password:
        description: "VPS root password"
        required: true
        type: string
      pki_b64:
        description: "base64 tar.gz of the shared OpenVPN CA (optional)"
        required: false
        type: string
        default: ""

concurrency:
  group: pulse-install
  cancel-in-progress: false

jobs:
  install:
    name: Install on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Only the non-secret target IP lives at job level. The password and the
    # PKI are deliberately NOT here — see the header comment.
    env:
      VPS_IP: ${{ github.event.client_payload.vps_ip || github.event.inputs.vps_ip }}

    steps:
      # MUST stay first, and MUST stay free of any `env:` block.
      - name: Mask credentials
        run: |
          set -euo pipefail
          # jq reads the raw event payload. Writing the values as a GitHub
          # expression instead would interpolate them into the script body,
          # which GitHub also prints — so the event file is the only
          # leak-free source. (Never put an empty expression in here either:
          # GitHub scans run: blocks for the expression opener and rejects the
          # whole workflow file if it finds nothing between the braces.)
          PW=$(jq -r '.client_payload.vps_password // .inputs.vps_password // empty' "$GITHUB_EVENT_PATH")
          PKI=$(jq -r '.client_payload.pki_b64 // .inputs.pki_b64 // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$PW" ]; then
            echo "::add-mask::$PW"
            echo "root password registered for masking"
          else
            echo "::error::vps_password missing from the event payload"
            exit 1
          fi
          if [ -n "$PKI" ]; then
            # The CA bundle carries server.key (a private key) — mask it too.
            echo "::add-mask::$PKI"
            echo "OpenVPN CA registered for masking"
          else
            echo "no OpenVPN CA supplied (a fresh one will be generated)"
          fi

      - name: Validate inputs
        env:
          VPS_PASSWORD_PRESENT: ${{ (github.event.client_payload.vps_password || github.event.inputs.vps_password) && 'yes' || 'no' }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_IP" ]; then echo "::error::vps_ip is missing"; exit 1; fi
          if [ "$VPS_PASSWORD_PRESENT" != "yes" ]; then echo "::error::vps_password is missing"; exit 1; fi
          # IPv4 sanity — the installer also uses it for the TLS certificate SAN
          if ! printf '%s' "$VPS_IP" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "::error::vps_ip is not an IPv4 address"; exit 1
          fi
          echo "Target: $VPS_IP"

      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Copy installer to the VPS
        env:
          # Step-level only, and already masked by the first step — the env
          # dump below renders these as ***.
          VPS_PASSWORD: ${{ github.event.client_payload.vps_password || github.event.inputs.vps_password }}
          PKI_B64: ${{ github.event.client_payload.pki_b64 || github.event.inputs.pki_b64 }}
          SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o LogLevel=ERROR
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          # accept the host key without prompting (runner is ephemeral)
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          # shellcheck disable=SC2086
          SSHPASS="$VPS_PASSWORD" sshpass -e scp $SSH_OPTS \
            install/pulse-install.sh "root@${VPS_IP}:/tmp/pulse-install.sh"

          # The shared OpenVPN CA, if the panel supplied one: reusing it is what
          # keeps the already-shipped client profiles verifying against the new
          # server. Without it a fresh CA is generated and repoint must re-embed.
          if [ -n "$PKI_B64" ]; then
            printf '%s' "$PKI_B64" | base64 -d > /tmp/pulse-pki.tgz
            # shellcheck disable=SC2086
            SSHPASS="$VPS_PASSWORD" sshpass -e scp $SSH_OPTS \
              /tmp/pulse-pki.tgz "root@${VPS_IP}:/tmp/pulse-pki.tgz"
            rm -f /tmp/pulse-pki.tgz
            echo "OpenVPN CA payload delivered"
          fi
          echo "installer copied"

      - name: Run installer
        env:
          VPS_PASSWORD: ${{ github.event.client_payload.vps_password || github.event.inputs.vps_password }}
          PKI_B64: ${{ github.event.client_payload.pki_b64 || github.event.inputs.pki_b64 }}
          SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o LogLevel=ERROR
        run: |
          set -euo pipefail
          PKI_ARG=""
          if [ -n "$PKI_B64" ]; then
            # read it back off the VPS rather than echoing the local copy, and
            # keep it out of `set -x`-style output by never printing it
            PKI_B64_REMOTE="$(SSHPASS="$VPS_PASSWORD" sshpass -e ssh $SSH_OPTS "root@${VPS_IP}" \
              'base64 -w0 /tmp/pulse-pki.tgz' 2>/dev/null || true)"
            if [ -n "$PKI_B64_REMOTE" ]; then
              PKI_ARG="--pki-b64 ${PKI_B64_REMOTE}"
            fi
          fi

          # Detached inside the session so a transient TCP reset cannot kill the
          # install halfway; we then poll its log to completion.
          # shellcheck disable=SC2086
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh $SSH_OPTS "root@${VPS_IP}" \
            "rm -f /tmp/pulse-install.log; nohup bash /tmp/pulse-install.sh --ip ${VPS_IP} ${PKI_ARG} >/tmp/pulse-install.log 2>&1 & echo LAUNCHED"

          for i in $(seq 1 150); do
            sleep 10
            # shellcheck disable=SC2086
            STATE=$(SSHPASS="$VPS_PASSWORD" sshpass -e ssh $SSH_OPTS "root@${VPS_IP}" \
              'grep -qE "ALL PORTS ACTIVE|SOME PORTS MISSING" /tmp/pulse-install.log 2>/dev/null && echo DONE || echo RUNNING' \
              2>/dev/null || echo SSH_BLIP)
            echo "poll $i: $STATE"
            [ "$STATE" = "DONE" ] && break
          done

          echo "=== install log ==="
          # shellcheck disable=SC2086
          SSHPASS="$VPS_PASSWORD" sshpass -e ssh $SSH_OPTS "root@${VPS_IP}" \
            'cat /tmp/pulse-install.log' 2>/dev/null || true

          echo "=== result ==="
          # shellcheck disable=SC2086
          RESULT=$(SSHPASS="$VPS_PASSWORD" sshpass -e ssh $SSH_OPTS "root@${VPS_IP}" \
            'grep -c "ALL PORTS ACTIVE" /tmp/pulse-install.log 2>/dev/null || true' 2>/dev/null || echo 0)
          if [ "${RESULT:-0}" -ge 1 ]; then
            echo "::notice::Install complete — all ports active on $VPS_IP"
          else
            echo "::error::Install did not report ALL PORTS ACTIVE on $VPS_IP"
            exit 1
          fi

      # The installer's own checks can only prove a socket is not bound to
      # loopback. This runs from GitHub's network, so it proves two things the
      # VPS cannot prove about itself: the ports answer a third party, and the
      # DNS ACL actually refuses a public source (i.e. we did not accidentally
      # create an open resolver — which would get the IP blocklisted).
      - name: Verify from outside the VPS
        env:
          VPS_IP: ${{ github.event.client_payload.vps_ip || github.event.inputs.vps_ip }}
        run: |
          set -euo pipefail
          echo "Probing $VPS_IP from GitHub's network, not from the VPS itself:"

          for p in 53 8080 80 443; do
            if timeout 8 bash -c "exec 3<>/dev/tcp/$VPS_IP/$p" 2>/dev/null; then
              echo "  tcp $p  OPEN"
            else
              echo "::error::tcp $p is not reachable from outside"
              exit 1
            fi
          done

          echo "HTTP on 8080:"
          curl -sS -m 10 "http://$VPS_IP:8080/" | head -1 | sed 's/^/  /'

          echo "DNS on 53 (a public source must be REFUSED, never answered):"
          python3 - "$VPS_IP" <<'PYEOF'
          import socket, struct, random, sys
          srv = sys.argv[1]
          pkt = struct.pack(">HHHHHH", random.randint(0, 65535), 0x0100, 1, 0, 0, 0)
          for lab in b"example.com".split(b"."):
              pkt += struct.pack("B", len(lab)) + lab
          pkt += b"\x00" + struct.pack(">HH", 1, 1)
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(8)
          try:
              s.sendto(pkt, (srv, 53))
              data, addr = s.recvfrom(4096)
          except socket.timeout:
              print("  no reply (filtered) — fine, that is not an open resolver")
              sys.exit(0)
          rcode = struct.unpack(">H", data[2:4])[0] & 0xF
          if rcode == 5:
              print("  REFUSED as expected — this host is NOT an open resolver")
          else:
              print("  rcode=%d from %s — answered a public source: OPEN RESOLVER" % (rcode, addr))
              sys.exit(1)
          PYEOF
          echo "external verification passed"
